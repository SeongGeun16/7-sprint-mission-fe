<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="frame">
            <a href="/" class="logo">
                <img class="panda_face" src="./imges/판다 얼굴.svg" alt="판다얼굴"/>
                <div class="panda_title">판다마켓</div>
            </a>
            <div class="loginbox">
                <div class="email">
                    <div class="id">
                        <div class="emailinput">
                            <div class="idtext">이메일</div>
                            <input class="emailtextinput" type="email" placeholder="이메일을 입력해주세요"></input>
                        </div>
                        <div class="password">
                            <div class="idtext">비밀번호</div>
                                <div class="passwordbar">
                                    <input class="passwordinput" type="password" placeholder="비밀번호를 입력해주세요"/>
                                    <img src="./imges/btn_visibility_on_24px.svg" alt="비밀번호표시" class="visibility"/>
                                </div>
                        </div>
                    </div>
                    <button class="btn_login">
                        <div class="btn_logintext">로그인</div>
                    </button>
                </div>
                <div class="simplicity">
                    <div class="simpleloginframe">
                        <div class="simplelogintext">간편 로그인하기</div>
                        <div class="simpleloginicon">
                            <a class="icon1" href="https://www.google.com/">
                            <img class="googleback" src="./imges/googleback.svg" alt="구글배경"/>
                            <img class="google" src="./imges/google.svg" alt="구글"/>
                            </a>
                            <a class="icon2" href="https://www.kakaocorp.com/page/">
                            <img class="kakao" src="./imges/99FE484C5C3451F218 1.svg" alt="카카오글자"/>
                            <img class="kakaoback" src="./imges/kakao.svg" alt="카카오배경"/>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="signup">
                    <div class="signuptext1">판다마켓이 처음이신가요?</div>
                    <a class="signuptext2" href="./signup.html">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
