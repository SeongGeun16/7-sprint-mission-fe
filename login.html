<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <div class="frame">
            <header>
            <a href="/" class="logo">
                <img class="panda_face" src="./imges/판다 얼굴.svg" alt="판다얼굴"/>
                <div class="panda_title">판다마켓</div>
            </a>
            </header>
            <main class="loginbox">
                <div class="email">
                    <div class="id">
                        <div class="emailinput">
                            <div class="idtext">이메일</div>
                            <input id="email" class="email_text_input" type="email" placeholder="이메일을 입력해주세요"></input>
                        </div>
                        <div class="password">
                            <div class="idtext">비밀번호</div>
                                <div class="passwordbar">
                                    <input id="password" class="passwordinput" type="password" placeholder="비밀번호를 입력해주세요"/>
                                    <img src="./imges/btn_visibility_on_24px.svg" alt="비밀번호표시" class="visibility"/>
                                </div>
                        </div>
                    </div>
                    <button class="btn_login" disabled>
                        <div class="btn_logintext">로그인</div>
                    </button>
                </div>
                <section class="simplicity">
                    <div class="simple_login_frame">
                        <div class="simple_login_text">간편 로그인하기</div>
                        <div class="simple_login_icon">
                            <a class="google_icon" href="https://www.google.com/">
                            <img class="googleback" src="./imges/googleback.svg" alt="구글배경"/>
                            <img class="google" src="./imges/google.svg" alt="구글"/>
                            </a>
                            <a class="kakao_icon" href="https://www.kakaocorp.com/page/">
                            <img class="kakao" src="./imges/99FE484C5C3451F218 1.svg" alt="카카오글자"/>
                            <img class="kakaoback" src="./imges/kakao.svg" alt="카카오배경"/>
                            </a>
                        </div>
                    </div>
                </section>
                <footer class="signup">
                    <div class="signuptext1">판다마켓이 처음이신가요?</div>
                    <a class="signuptext2" href="./signup.html">회원가입</a>
                </footer>
            </main>
        </div>
    </div>
    <div id="modal" class="modal hidden">
        <div id="modal-box" class="modal-box">
            <div id="modal-message" class="modal-message"></div>
            <button id="modal-check" class="modal-check">확인</button>
        </div>
    </div>

    <script src="./login.js"></script>
</body>
</html>
